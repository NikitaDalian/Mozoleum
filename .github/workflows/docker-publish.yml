name: Docker Publish

# Builds the МОЗОЛЕУМ image on GitHub (which has full network access) and
# pushes it to Docker Hub, so a server that can't reach GitHub can still pull a
# ready-made image. Enable by setting repo variable DOCKER_PUBLISH = true and
# adding secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    if: ${{ vars.DOCKER_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mozoleum:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mozoleum:${{ github.sha }}
      - name: Summary
        run: echo "Pushed ${{ secrets.DOCKERHUB_USERNAME }}/mozoleum:latest" >> "$GITHUB_STEP_SUMMARY"
